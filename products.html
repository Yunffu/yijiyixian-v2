<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一季一鲜 · 商品列表</title>
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    :root {
      --c-dark:   #4A4A35;
      --c-green:  #4A7A38;
      --c-millet: #E8D8A0;
      --c-white:  #F8F5EF;
      --c-text:   #EDE8DF;
      --c-ink:    #2C2C2A;
      --c-earth:  #A0846A;
      --c-warm-gray: #F2EDE5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--c-white);
      color: var(--c-ink);
      overflow-x: hidden;
      font-family: "Noto Serif SC", serif;
    }

    /* ═══════════════════════════════
       导航栏
    ═══════════════════════════════ */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 2000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 48px; height: 64px;
      background: rgba(248,245,239,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(74,74,53,0.1);
    }
    .nav-left { display: flex; align-items: center; gap: 48px; }
    .nav-logo {
      font-family: "Ma Shan Zheng", serif;
      font-size: 22px; letter-spacing: 0.2em;
      text-decoration: none; color: var(--c-ink);
    }
    .nav-links { display: flex; gap: 32px; }
    .nav-link {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 14px; letter-spacing: 0.15em;
      text-decoration: none; opacity: 0.75;
      transition: opacity 200ms, color 400ms;
      color: var(--c-ink);
    }
    .nav-link:hover { opacity: 1; }
    .nav-link.active { opacity: 1; border-bottom: 1px solid currentColor; }
    .nav-right { display: flex; align-items: center; gap: 16px; }

    .nav-search-wrap {
      flex: 1; max-width: 600px; margin: 0 24px; position: relative;
    }
    .nav-search-input {
      width: 100%; padding: 8px 16px 8px 40px;
      border-radius: 24px;
      border: 1px solid rgba(74,74,53,0.25);
      background: var(--c-white);
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 13px; letter-spacing: 0.1em;
      color: var(--c-ink); outline: none; transition: all 250ms;
    }
    .nav-search-input::placeholder { color: rgba(74,74,53,0.4); }
    .nav-search-input:focus { border-color: var(--c-green); }
    .nav-search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; pointer-events: none;
      color: rgba(74,74,53,0.5);
    }
    .nav-search-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 24px; height: 24px;
      border: none; background: transparent;
      cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: color 200ms;
      color: rgba(74,74,53,0.5);
    }
    .nav-search-btn svg { width: 14px; height: 14px; }
    .nav-search-btn:hover { color: var(--c-green); }
    .nav-btn {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 13px; letter-spacing: 0.12em;
      padding: 8px 22px; border-radius: 24px;
      text-decoration: none; transition: all 200ms; white-space: nowrap;
      color: var(--c-ink); border: 1px solid rgba(74,74,53,0.3);
    }
    .nav-btn:hover { background: var(--c-green); color: var(--c-text); border-color: var(--c-green); }

    /* ═══════════════════════════════
       页面头部
    ═══════════════════════════════ */
    #page-header {
      padding: 100px 64px 40px;
      background: var(--c-white);
      border-bottom: 1px solid rgba(74,74,53,0.08);
    }
    .header-content { max-width: 1400px; margin: 0 auto; }
    .header-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; letter-spacing: 0.12em; color: var(--c-ink); text-decoration: none; margin-bottom: 16px; transition: color 200ms; padding: 6px 14px 6px 10px; border-radius: 20px; border: 1px solid rgba(74,74,53,0.2); background: rgba(255,255,255,0.6); }
    .header-back:hover { color: var(--c-green); border-color: var(--c-green); background: rgba(74,122,56,0.06); }
    .header-back svg { transition: transform 200ms; }
    .header-back:hover svg { transform: translateX(-3px); }
    .header-title { font-family: "Ma Shan Zheng", serif; font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: 0.12em; color: var(--c-ink); }
    .header-sub { font-size: 14px; letter-spacing: 0.08em; color: rgba(44,44,42,0.65); margin-top: 8px; font-weight: 300; }

    /* ═══════════════════════════════
       筛选栏
    ═══════════════════════════════ */
    #filters {
      position: sticky; top: 64px; z-index: 100;
      background: rgba(248,245,239,0.96);
      backdrop-filter: blur(12px);
      padding: 16px 64px;
      border-bottom: 1px solid rgba(74,74,53,0.08);
    }
    .filters-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-label { font-size: 13px; letter-spacing: 0.2em; color: rgba(44,44,42,0.7); width: 56px; flex-shrink: 0; font-weight: 400; }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      font-family: "Noto Serif SC", serif; font-weight: 400;
      font-size: 13px; letter-spacing: 0.08em;
      padding: 7px 18px; border-radius: 20px;
      border: 1px solid rgba(74,74,53,0.25);
      background: transparent; color: rgba(44,44,42,0.75);
      cursor: pointer; transition: all 180ms;
    }
    .filter-btn:hover { border-color: var(--c-green); color: var(--c-green); }
    .filter-btn.active { background: var(--c-green); color: #fff; border-color: var(--c-green); }

    /* 品类筛选颜色 */
    .filter-btn[data-cat="fruit"].active { background: #C85A20; border-color: #C85A20; }
    .filter-btn[data-cat="veg"].active { background: #3A7235; border-color: #3A7235; }
    .filter-btn[data-cat="meat"].active { background: #96541E; border-color: #96541E; }
    .filter-btn[data-cat="fish"].active { background: #1E6480; border-color: #1E6480; }
    .filter-btn[data-cat="other"].active { background: #7A6A8A; border-color: #7A6A8A; }

    /* ═══════════════════════════════
       商品网格
    ═══════════════════════════════ */
    #product-section { padding: 48px 0 100px; background: var(--c-white); }
    .prod-wrap { max-width: 1400px; margin: 0 auto; padding: 0 64px; }
    .prod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .prod-count { font-size: 13px; letter-spacing: 0.1em; color: rgba(44,44,42,0.4); margin-bottom: 24px; }

    /* 刷新按钮 */
    .prod-refresh-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 12px; letter-spacing: 0.15em;
      padding: 8px 18px; border-radius: 20px;
      border: 1px solid rgba(74,74,53,0.2);
      background: transparent; color: rgba(44,44,42,0.6);
      cursor: pointer; transition: all 200ms;
    }
    .prod-refresh-btn:hover { background: var(--c-green); color: #fff; border-color: var(--c-green); }
    .prod-refresh-btn.spinning svg { animation: spin 0.6s linear; }
    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

    .prod-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }

    /* 商品卡片 */
    .prod-card {
      border-radius: 14px; overflow: hidden;
      background: #fff; box-shadow: 0 2px 16px rgba(74,74,53,0.07);
      transition: transform 280ms ease, box-shadow 280ms ease, opacity 400ms ease;
      cursor: pointer; opacity: 1;
    }
    .prod-card:hover { transform: translateY(-6px); box-shadow: 0 10px 32px rgba(74,74,53,0.14); }
    .prod-img-wrap { position: relative; height: 220px; overflow: hidden; }
    .prod-img-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 300ms;
    }
    .prod-img-placeholder span {
      font-family: monospace; font-size: 10px;
      color: rgba(255,255,255,0.25); letter-spacing: 0.06em;
      text-align: center; padding: 0 12px;
    }
    /* 七大区各自配色 */
    .prod-card[data-region="东北"]  .prod-img-placeholder { background: linear-gradient(135deg,#2A3A4A,#1A2A3A); }
    .prod-card[data-region="华北"]  .prod-img-placeholder { background: linear-gradient(135deg,#3A3A2A,#2A2A1A); }
    .prod-card[data-region="华东"]  .prod-img-placeholder { background: linear-gradient(135deg,#2A4A3A,#1A3A2A); }
    .prod-card[data-region="华中"]  .prod-img-placeholder { background: linear-gradient(135deg,#4A3A2A,#3A2A1A); }
    .prod-card[data-region="华南"]  .prod-img-placeholder { background: linear-gradient(135deg,#3A2A4A,#2A1A3A); }
    .prod-card[data-region="西南"]  .prod-img-placeholder { background: linear-gradient(135deg,#2A4A4A,#1A3A3A); }
    .prod-card[data-region="西北"]  .prod-img-placeholder { background: linear-gradient(135deg,#4A4A2A,#3A3A1A); }
    .prod-img-p2 { background: var(--c-green); opacity: 0; }
    .prod-card:hover .prod-img-placeholder { opacity: 0; }
    .prod-card:hover .prod-img-p2 { opacity: 1; }
    .prod-tag-badge {
      position: absolute; top: 12px; left: 12px;
      font-family: "Noto Serif SC", serif; font-weight: 400;
      font-size: 11px; letter-spacing: 0.12em;
      padding: 5px 12px; border-radius: 20px;
      background: var(--c-green); color: #fff;
      box-shadow: 0 2px 8px rgba(74,122,56,0.35);
    }
    .prod-region-badge {
      position: absolute; top: 12px; right: 12px;
      font-size: 10px; letter-spacing: 0.1em;
      padding: 3px 9px; border-radius: 12px;
      background: rgba(255,255,255,0.15); color: rgba(237,232,223,0.8);
      backdrop-filter: blur(4px);
    }
    .prod-card-body { padding: 18px 20px 20px; }
    .prod-region {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 11px; letter-spacing: 0.15em;
      color: var(--c-earth); margin-bottom: 6px;
    }
    .prod-name {
      font-family: "Ma Shan Zheng", serif;
      font-size: 1.2rem; letter-spacing: 0.12em; color: var(--c-ink);
      margin-bottom: 8px;
    }
    .prod-desc {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 0.8rem; letter-spacing: 0.06em; line-height: 1.7;
      color: rgba(44,44,42,0.55); margin-bottom: 14px;
    }
    .prod-footer { display: flex; justify-content: space-between; align-items: center; }
    .prod-price {
      font-family: "Noto Serif SC", serif; font-weight: 400;
      font-size: 1.05rem; letter-spacing: 0.05em; color: var(--c-ink);
    }
    .prod-cart-btn {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 0.78rem; letter-spacing: 0.15em;
      padding: 7px 16px; border-radius: 20px;
      border: 1px solid rgba(74,122,56,0.35);
      background: transparent; color: var(--c-green);
      cursor: pointer; transition: all 200ms;
    }
    .prod-cart-btn:hover { background: var(--c-green); color: var(--c-text); }

    /* 无结果 */
    .empty-state { text-align: center; padding: 80px 40px; }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state-title { font-family: "Ma Shan Zheng", serif; font-size: 1.5rem; letter-spacing: 0.15em; color: var(--c-ink); margin-bottom: 8px; }
    .empty-state-text { font-size: 13px; letter-spacing: 0.1em; color: rgba(44,44,42,0.45); }

    /* ═══════════════════════════════
       Footer
    ═══════════════════════════════ */
    #footer { position: relative; background: #2D5A1E; padding: 40px 0 0; margin-top: 80px; }
    .footer-wrap { max-width: 1400px; margin: 0 auto; padding: 0 64px 40px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(237,232,223,0.08); }
    .footer-logo { font-family: "Ma Shan Zheng", serif; font-size: 2rem; letter-spacing: 0.25em; color: var(--c-text); margin-bottom: 16px; }
    .footer-slogan { font-family: "Noto Serif SC", serif; font-weight: 300; font-size: 0.8rem; letter-spacing: 0.2em; line-height: 2; color: rgba(237,232,223,0.7); }
    .footer-links { display: flex; gap: 80px; }
    .footer-col { display: flex; flex-direction: column; gap: 14px; }
    .footer-col-title { font-family: "Noto Serif SC", serif; font-weight: 300; font-size: 0.75rem; letter-spacing: 0.4em; color: rgba(237,232,223,0.6); margin-bottom: 4px; }
    .footer-col a { font-family: "Noto Serif SC", serif; font-weight: 300; font-size: 0.875rem; letter-spacing: 0.12em; color: rgba(237,232,223,0.85); text-decoration: none; }
    .footer-col a:hover { color: var(--c-text); }
    .footer-bottom { text-align: center; padding: 24px; font-family: "Noto Serif SC", serif; font-weight: 300; font-size: 0.75rem; letter-spacing: 0.2em; color: rgba(237,232,223,0.5); }

    /* Toast */
    #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--c-ink); color: var(--c-text); padding: 14px 32px; border-radius: 40px; font-family: "Noto Serif SC", serif; font-weight: 300; font-size: 14px; letter-spacing: 0.15em; box-shadow: 0 8px 32px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity 300ms, transform 300ms; z-index: 9999; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    /* ══════════════════════════════
       商品数据（来自 data.js）
       上线后替换为 fetch('/api/products')
    ══════════════════════════════ */
    const mockProducts = PRODUCTS;

    /* ══════════════════════════════
       URL 参数解析（支持从 hash 获取搜索参数）
    ══════════════════════════════ */
    const params = new URLSearchParams(window.location.search);
    const regionParam = params.get('region');
    const zoneParam = params.get('zone');
    const catParam = params.get('cat');

    // 从 hash 中获取搜索参数，格式: #q=苹果
    let qParam = null;
    const hashMatch = window.location.hash.match(/[#&]?q=([^&]+)/);
    if (hashMatch) {
      qParam = decodeURIComponent(hashMatch[1]);
    }

    const cookieMatch = document.cookie.match(/targetRegion=([^;]+)/);
    let initialRegion = 'all';
    // 从首页专区按钮跳转时（有 zone 参数），强制使用 region=all
    if (zoneParam) {
      initialRegion = 'all'; // 有专区参数时强制使用全部地区，忽略 cookie 和 URL 中的 region
    } else if (qParam) {
      initialRegion = 'all'; // 有搜索词时忽略地区
    } else if (regionParam) {
      initialRegion = decodeURIComponent(regionParam);
    } else if (cookieMatch) {
      initialRegion = decodeURIComponent(cookieMatch[1]);
    }

    const initialQ = qParam ? qParam : '';
    const initialZone = zoneParam ? decodeURIComponent(zoneParam) : 'all';
    const initialCat = catParam ? decodeURIComponent(catParam) : 'all';

    let currentQ = initialQ;
    let currentZone = initialZone;
    let currentRegion = initialRegion;
    let currentCat = initialCat;

    /* ══════════════════════════════
       搜索框
    ══════════════════════════════ */
    document.getElementById('searchInput').value = initialQ;
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = e.target.value.trim();
        currentQ = q;
        currentZone = 'all';
        currentRegion = 'all';
        currentCat = 'all';
        // 使用 hash 传递搜索参数
        const url = new URL(window.location);
        url.hash = q ? 'q=' + encodeURIComponent(q) : '';
        history.replaceState(null, '', url);
        setActiveZone('all');
        setActiveRegion('all');
        setActiveCat('all');
        renderProducts(pickNine(getFiltered()));
        updatePageTitle();
      }
    });

    document.getElementById('searchBtn').addEventListener('click', function() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) {
        currentQ = q;
        currentZone = 'all';
        currentRegion = 'all';
        currentCat = 'all';
        const url = new URL(window.location);
        url.hash = 'q=' + encodeURIComponent(q);
        history.replaceState(null, '', url);
        setActiveZone('all');
        setActiveRegion('all');
        setActiveCat('all');
        renderProducts(pickNine(getFiltered()));
        updatePageTitle();
      }
    });

    /* ══════════════════════════════
       页面标题更新
    ══════════════════════════════ */
    function updatePageTitle() {
      const title = document.getElementById('pageTitle');
      const sub = document.getElementById('pageSub');
      const catNames = { fruit: '水果', veg: '蔬菜', meat: '蛋奶肉', fish: '水产', other: '其它' };
      const zoneNames = { 'tech-farming': '科技耕养·臻选鲜品', 'light-diet': '轻盈控卡·减脂轻食', wellness: '药食同源·养生鲜材' };

      if (currentQ) {
        if (title) title.textContent = '搜索：' + currentQ;
      } else {
        const parts = [];
        if (currentZone !== 'all' && zoneNames[currentZone]) {
          parts.push(zoneNames[currentZone]);
        }
        if (currentRegion !== 'all') {
          parts.push(currentRegion + '产区');
        }
        if (currentCat !== 'all' && catNames[currentCat]) {
          parts.push(catNames[currentCat]);
        }
        if (title) {
          title.textContent = parts.length > 0 ? parts.join(' · ') : '全部商品';
        }
      }
    }
    updatePageTitle();

    /* ══════════════════════════════
       筛选逻辑
    ══════════════════════════════ */
    function getFiltered() {
      return mockProducts.filter(p => {
        const matchZone = currentZone === 'all' || (p.zone === currentZone && p.tag);
        const matchRegion = currentRegion === 'all' || p.region === currentRegion;
        const matchCat = currentCat === 'all' || p.cat === currentCat;
        const matchQ = !currentQ || [p.name, p.desc, p.loc].some(field => field.includes(currentQ));
        return matchZone && matchRegion && matchCat && matchQ;
      });
    }

    /* ══════════════════════════════
       换一批（打乱显示）
    ══════════════════════════════ */
    function pickNine(pool) {
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, Math.min(9, shuffled.length));
    }

    function refreshProducts() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      setTimeout(() => btn.classList.remove('spinning'), 600);
      const filtered = getFiltered();
      renderProducts(pickNine(filtered));
    }

    /* ══════════════════════════════
       渲染商品
    ══════════════════════════════ */
    function renderProducts(list) {
      const grid = document.getElementById('prodGrid');
      const emptyState = document.getElementById('emptyState');
      const resultCount = document.getElementById('resultCount');
      const totalCount = document.getElementById('totalCount');

      grid.innerHTML = '';
      if (resultCount) resultCount.textContent = '显示 ' + list.length + ' 个商品';
      if (totalCount) totalCount.textContent = list.length;

      if (list.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      list.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'prod-card';
        card.dataset.region = p.region;
        card.innerHTML = `
          <div class="prod-img-wrap">
            <div class="prod-img-placeholder prod-img-p1">
              <span>[图片占位] ${p.name}.jpg</span>
            </div>
            <div class="prod-img-placeholder prod-img-p2"></div>
            ${p.tag ? `<span class="prod-tag-badge">${p.tag}</span>` : ''}
            <span class="prod-region-badge">${p.region}</span>
          </div>
          <div class="prod-card-body">
            <p class="prod-region">📍 ${p.loc}</p>
            <h3 class="prod-name">${p.name}</h3>
            <p class="prod-desc">${p.desc}</p>
            <div class="prod-footer">
              <span class="prod-price">${p.price} <small style="font-size:0.7em;opacity:0.5">/斤</small></span>
              <button class="prod-cart-btn">查看详情</button>
            </div>
          </div>`;
        card.querySelector('.prod-cart-btn').addEventListener('click', e => {
          e.stopPropagation();
          // 存储当前列表页URL到sessionStorage，供后续返回列表使用
          sessionStorage.setItem('originListUrl', window.location.href);
          const searchKey = currentQ || '';
          const searchParam = searchKey ? '&searchKey=' + encodeURIComponent(searchKey) + '&searchHash=' + encodeURIComponent('q=' + searchKey) : '';
          window.location.href = 'product-detail.html?id=' + p.id + '&from=products' + searchParam;
        });
        grid.appendChild(card);
        // 用 requestAnimationFrame 确保 DOM 已渲染再加 class 触发动画

      });
    }

    /* ══════════════════════════════
       专区筛选
    ══════════════════════════════ */
    function setActiveZone(zone) {
      currentZone = zone;
      document.querySelectorAll('#zoneFilters .filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.zone === zone);
      });
      const list = getFiltered();
      renderProducts(pickNine(list));
      updateURL();
      updatePageTitle();
    }

    document.getElementById('zoneFilters').addEventListener('click', e => {
      if (!e.target.classList.contains('filter-btn')) return;
      setActiveZone(e.target.dataset.zone);
    });

    /* ══════════════════════════════
       品类筛选
    ══════════════════════════════ */
    function setActiveCat(cat) {
      currentCat = cat;
      document.querySelectorAll('#catFilters .filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      const list = getFiltered();
      renderProducts(pickNine(list));
      updateURL();
      updatePageTitle();
    }

    document.getElementById('catFilters').addEventListener('click', e => {
      if (!e.target.classList.contains('filter-btn')) return;
      setActiveCat(e.target.dataset.cat);
    });

    /* ══════════════════════════════
       大区筛选
    ══════════════════════════════ */
    function setActiveRegion(region) {
      currentRegion = region;
      document.querySelectorAll('#regionFilters .filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.region === region);
      });
      const list = getFiltered();
      renderProducts(pickNine(list));
      updateURL();
      updatePageTitle();
    }

    document.getElementById('regionFilters').addEventListener('click', e => {
      if (!e.target.classList.contains('filter-btn')) return;
      setActiveRegion(e.target.dataset.region);
    });

    /* ══════════════════════════════
       URL 同步（筛选时不刷新页面）
    ══════════════════════════════ */
    function updateURL() {
      const url = new URL(window.location);
      if (currentQ) url.searchParams.set('q', currentQ);
      else url.searchParams.delete('q');
      if (currentCat !== 'all') url.searchParams.set('cat', currentCat);
      else url.searchParams.delete('cat');
      if (currentZone !== 'all') url.searchParams.set('zone', currentZone);
      else url.searchParams.delete('zone');
      if (currentRegion !== 'all') url.searchParams.set('region', currentRegion);
      else url.searchParams.delete('region');
      history.replaceState(null, '', url);
    }

    /* ══════════════════════════════
       Toast
    ══════════════════════════════ */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    /* ══════════════════════════════
       初始化筛选按钮状态
    ══════════════════════════════ */
    // 专区按钮初始化
    document.querySelectorAll('#zoneFilters .filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.zone === initialZone);
    });
    // 地区按钮初始化
    document.querySelectorAll('#regionFilters .filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.region === initialRegion);
    });
    // 品类按钮初始化
    document.querySelectorAll('#catFilters .filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.cat === initialCat);
    });

    /* ══════════════════════════════
       初始化
    ══════════════════════════════ */
    // 强制同步 URL，确保与当前状态一致
    updateURL();
    renderProducts(pickNine(getFiltered()));
    updatePageTitle();


    window.addEventListener('load', () => {
      setTimeout(() => ScrollTrigger.refresh(), 200);
      // 有搜索词时滚动到商品列表
      if (qParam) {
        const target = document.getElementById('product-section');
        if (target) {
          setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 300);
        }
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一季一鲜 · 认养农场</title>
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    :root {
      --c-dark:   #4A4A35;
      --c-green:  #4A7A38;
      --c-millet: #E8D8A0;
      --c-white:  #F8F5EF;
      --c-text:   #EDE8DF;
      --c-ink:    #2C2C2A;
      --c-earth:  #A0846A;
      --c-warm-gray: #F2EDE5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--c-white);
      color: var(--c-ink);
      overflow-x: hidden;
      font-family: "Noto Serif SC", serif;
    }

    /* ═══════════════════════════════
       导航栏
    ═══════════════════════════════ */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 2000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 48px; height: 64px;
      background: rgba(248,245,239,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(74,74,53,0.1);
    }
    .nav-left { display: flex; align-items: center; gap: 48px; }
    .nav-logo {
      font-family: "Ma Shan Zheng", serif;
      font-size: 22px; letter-spacing: 0.2em;
      text-decoration: none; color: var(--c-ink);
    }
    .nav-links { display: flex; gap: 32px; }
    .nav-link {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 14px; letter-spacing: 0.15em;
      text-decoration: none; opacity: 0.75;
      transition: opacity 200ms, color 400ms;
      color: var(--c-ink);
    }
    .nav-link:hover { opacity: 1; }
    .nav-link.active { opacity: 1; border-bottom: 1px solid currentColor; }
    .nav-right { display: flex; align-items: center; gap: 16px; }

    .nav-search-wrap {
      flex: 1; max-width: 600px; margin: 0 24px; position: relative;
    }
    .nav-search-input {
      width: 100%; padding: 8px 16px 8px 40px;
      border-radius: 24px;
      border: 1px solid rgba(74,74,53,0.25);
      background: var(--c-white);
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 13px; letter-spacing: 0.1em;
      color: var(--c-ink); outline: none; transition: all 250ms;
    }
    .nav-search-input::placeholder { color: rgba(74,74,53,0.4); }
    .nav-search-input:focus { border-color: var(--c-green); }
    .nav-search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; pointer-events: none;
      color: rgba(74,74,53,0.5);
    }
    .nav-search-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 24px; height: 24px;
      border: none; background: transparent;
      cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: color 200ms;
      color: rgba(74,74,53,0.5);
    }
    .nav-search-btn svg { width: 14px; height: 14px; }
    .nav-search-btn:hover { color: var(--c-green); }
    .nav-btn {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 13px; letter-spacing: 0.12em;
      padding: 8px 22px; border-radius: 24px;
      text-decoration: none; transition: all 200ms; white-space: nowrap;
      color: var(--c-ink); border: 1px solid rgba(74,74,53,0.3);
    }
    .nav-btn:hover { background: var(--c-green); color: var(--c-text); border-color: var(--c-green); }

    /* ═══════════════════════════════
       Hero 区
    ═══════════════════════════════ */
    #hero {
      position: relative; height: 60vh; min-height: 480px;
      display: flex; align-items: center;
      overflow: hidden;
    }
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #3A4A2A 0%, #2A3A1A 40%, #1A2A0E 100%);
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1;
    }
    /* 装饰圆形 */
    .hero-deco {
      position: absolute; inset: 0; pointer-events: none;
    }
    .hero-deco::before {
      content: ''; position: absolute;
      width: 400px; height: 400px; border-radius: 50%;
      border: 1px solid rgba(232,216,160,0.08);
      top: 50%; left: 60%; transform: translate(-50%,-60%);
      box-shadow: 0 0 0 60px rgba(232,216,160,0.03), 0 0 0 120px rgba(232,216,160,0.015);
    }
    .hero-content {
      position: relative; z-index: 2;
      padding-left: 10vw;
      display: flex; flex-direction: column; gap: 16px;
    }
    .hero-label {
      font-size: 10px; letter-spacing: 0.5em;
      color: rgba(232,216,160,0.6);
      opacity: 0; filter: blur(8px);
    }
    .hero-title {
      font-family: "Ma Shan Zheng", serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      letter-spacing: 0.15em; color: var(--c-text);
      opacity: 0; filter: blur(20px);
    }
    .hero-sub {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: clamp(0.85rem, 1.3vw, 1rem);
      letter-spacing: 0.2em; color: rgba(237,232,223,0.7);
      opacity: 0; filter: blur(12px);
    }
    .hero-scroll-hint {
      position: absolute; bottom: 40px; left: 50%;
      z-index: 3; display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      opacity: 0; animation: fadeInUp 1s ease 1.5s forwards;
    }
    .hero-scroll-hint .scroll-content {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      animation: scrollBounce 1.5s ease infinite 1.5s;
    }
    .hero-scroll-hint span {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 0.72rem; letter-spacing: 0.3em;
      color: rgba(232,216,160,0.6);
    }
    .hero-scroll-arrow {
      width: 1px; height: 40px;
      background: linear-gradient(to bottom, rgba(232,216,160,0.5), transparent);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes scrollBounce {
      0%,100% { transform: translateY(0); opacity: 0.5; }
      50%      { transform: translateY(-8px); opacity: 1; }
    }

    /* ═══════════════════════════════
       商品列表区
    ═══════════════════════════════ */
    #products {
      background: var(--c-white);
      padding: 80px 0 100px;
    }
    .prod-wrap {
      max-width: 1400px; margin: 0 auto; padding: 0 64px;
    }
    .prod-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 32px;
    }
    .prod-label-top {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 14px; letter-spacing: 0.4em; color: var(--c-green); margin-bottom: 10px;
    }
    .prod-title {
      font-family: "Ma Shan Zheng", serif;
      font-size: clamp(1.8rem, 3vw, 3rem);
      letter-spacing: 0.15em; color: var(--c-ink);
      opacity: 0; filter: blur(12px);
    }
    .prod-count {
      font-size: 13px; letter-spacing: 0.15em;
      color: rgba(44,44,42,0.5);
    }

    /* 筛选栏 */
    .prod-filters {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .prod-filter {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 13px; letter-spacing: 0.12em;
      padding: 8px 20px; border-radius: 24px;
      border: 1px solid rgba(74,74,53,0.2);
      background: transparent; color: rgba(44,44,42,0.65);
      cursor: pointer; transition: all 200ms;
    }
    .prod-filter:hover { border-color: var(--c-green); color: var(--c-green); }
    .prod-filter.active { background: var(--c-green); color: var(--c-text); border-color: var(--c-green); }

    /* 商品网格 */
    .prod-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
    }
    .prod-card {
      border-radius: 16px; overflow: hidden;
      background: #fff; box-shadow: 0 2px 20px rgba(74,74,53,0.08);
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      opacity: 0; transform: translateY(24px);
    }
    .prod-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 14px 40px rgba(74,74,53,0.15);
    }
    .prod-img-wrap { position: relative; height: 200px; overflow: hidden; background: linear-gradient(135deg, #2A4A2A, #1A3A1A); }
    .prod-img-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }
    .prod-img-placeholder span {
      font-family: monospace; font-size: 10px;
      color: rgba(255,255,255,0.3); letter-spacing: 0.06em;
    }
    /* 各类别背景色 */
    .prod-card[data-type="fruit"] .prod-img-placeholder { background: linear-gradient(135deg, #2A4A2A, #1A3A1A); }
    .prod-card[data-type="field"] .prod-img-placeholder { background: linear-gradient(135deg, #4A3A2A, #3A2A1A); }
    .prod-card[data-type="ranch"] .prod-img-placeholder { background: linear-gradient(135deg, #2A3A4A, #1A2A3A); }
    .prod-type-badge {
      position: absolute; top: 12px; left: 12px;
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 10px; letter-spacing: 0.12em;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(74,74,53,0.75); color: var(--c-text);
      backdrop-filter: blur(4px);
    }
    .prod-card-body { padding: 20px 22px 22px; }
    .prod-name {
      font-family: "Ma Shan Zheng", serif;
      font-size: 1.25rem; letter-spacing: 0.1em; color: var(--c-ink);
      margin-bottom: 10px;
    }
    .prod-meta {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 8px;
    }
    .prod-farmer {
      font-size: 12px; letter-spacing: 0.08em;
      color: var(--c-earth);
    }
    .prod-rating {
      font-size: 11px; letter-spacing: 0.05em;
      color: rgba(74,122,56,0.8);
    }
    .prod-location {
      font-size: 11px; letter-spacing: 0.1em;
      color: rgba(44,44,42,0.5);
      margin-bottom: 12px;
    }
    .prod-time {
      font-size: 12px; letter-spacing: 0.08em;
      color: rgba(44,44,42,0.6);
      margin-bottom: 16px;
      padding: 8px 12px;
      background: var(--c-warm-gray);
      border-radius: 8px;
    }
    .prod-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(74,74,53,0.08);
    }
    .prod-price {
      font-family: "Noto Serif SC", serif; font-weight: 400;
      font-size: 1.1rem; letter-spacing: 0.05em; color: var(--c-ink);
    }
    .prod-price small {
      font-size: 0.7em; font-weight: 300;
      color: rgba(44,44,42,0.5);
    }
    .prod-detail-btn {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 12px; letter-spacing: 0.12em;
      padding: 8px 18px; border-radius: 20px;
      border: 1px solid rgba(74,122,56,0.4);
      background: transparent; color: var(--c-green);
      cursor: pointer; transition: all 200ms;
    }
    .prod-detail-btn:hover { background: var(--c-green); color: var(--c-text); }

    /* ═══════════════════════════════
       Footer
    ═══════════════════════════════ */
    #footer { position: relative; background: #2D5A1E; padding: 40px 0 0; border-top: 1px solid rgba(237,232,223,0.06); }
    .footer-wrap {
      max-width: 1400px; margin: 0 auto; padding: 0 64px 40px;
      display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1px solid rgba(237,232,223,0.08);
    }
    .footer-logo {
      font-family: "Ma Shan Zheng", serif;
      font-size: 2rem; letter-spacing: 0.25em; color: var(--c-text); margin-bottom: 16px;
    }
    .footer-slogan {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 0.8rem; letter-spacing: 0.2em; line-height: 2;
      color: rgba(237,232,223,0.7);
    }
    .footer-links { display: flex; gap: 80px; }
    .footer-col { display: flex; flex-direction: column; gap: 14px; }
    .footer-col-title {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 0.75rem; letter-spacing: 0.4em;
      color: rgba(237,232,223,0.6); margin-bottom: 4px;
    }
    .footer-col a {
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 0.875rem; letter-spacing: 0.12em;
      color: rgba(237,232,223,0.85); text-decoration: none; transition: color 200ms;
    }
    .footer-col a:hover { color: var(--c-text); }
    .footer-bottom {
      text-align: center; padding: 24px;
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 0.75rem; letter-spacing: 0.2em;
      color: rgba(237,232,223,0.5);
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--c-ink); color: var(--c-text);
      padding: 14px 32px; border-radius: 40px;
      font-family: "Noto Serif SC", serif; font-weight: 300;
      font-size: 14px; letter-spacing: 0.15em;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      opacity: 0; pointer-events: none;
      transition: opacity 300ms, transform 300ms;
      z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- ═══ 导航栏 ═══ -->
  <nav id="nav">
    <div class="nav-left">
      <a class="nav-logo" href="index.html">一季一鲜</a>

  <!-- ═══ 商品列表区 ═══ -->

  <!-- ═══ Toast ═══ -->
  <div id="toast">已加入购物车</div>

  <!-- 公共数据 -->
  <script src="farm-detail-1/js/farm-data.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    /* ══════════════════════════════
       搜索框回车跳转
    ══════════════════════════════ */
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = e.target.value.trim();
        if (q) window.location.href = `products.html#q=${encodeURIComponent(q)}`;
      }
    });

    document.getElementById('searchBtn').addEventListener('click', function() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) window.location.href = 'products.html#q=' + encodeURIComponent(q);
    });

    /* ══════════════════════════════
       Hero 入场动效
    ══════════════════════ */
    window.addEventListener('load', () => {
      const tl = gsap.timeline({ delay: 0.2 });
      tl.to('.hero-label', { opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' })
        .to('.hero-title',  { opacity: 1, filter: 'blur(0px)', duration: 0.8, ease: 'power2.out' }, '-=0.2')
        .to('.hero-sub',    { opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, '-=0.3');
    });

    /* ══════════════════════════════
       渲染商品
    ══════════════════════════════ */
    let currentType = 'all';

    function getFiltered(type) {
      const projects = window.FarmAdoptData.projects;
      return type === 'all' ? projects : projects.filter(p => p.type === type);
    }

    function renderProducts(list) {
      const grid = document.getElementById('prodGrid');
      grid.innerHTML = '';
      document.getElementById('totalCount').textContent = list.length;

      list.forEach((p, i) => {
        const typeLabel = { fruit: '果树认养', field: '田地认养', ranch: '牧场认养' }[p.type];
        const card = document.createElement('div');
        card.className = 'prod-card';
        card.dataset.type = p.type;
        
        // 构建图片 HTML
        const imgHtml = p.image 
          ? `<img src="${p.image}" alt="${p.name}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />`
          : `<span>[${p.location}] ${p.name}</span>`;
        
        card.innerHTML = `
          <div class="prod-img-wrap">
            <div class="prod-img-placeholder">${imgHtml}</div>
            <span class="prod-type-badge">${typeLabel}</span>
          </div>
          <div class="prod-card-body">
            <h3 class="prod-name">${p.name}</h3>
            <p class="prod-location">📍 ${p.location}</p>
            <div class="prod-time">🌾 ${p.harvestTime}</div>
            <div class="prod-footer">
              <span class="prod-price">¥${p.price} <small>/ ${p.unit}</small></span>
              <button class="prod-detail-btn" onclick="goDetail('${p.id}')">查看详情</button>
            </div>
          </div>`;
        grid.appendChild(card);
        gsap.to(card, {
          opacity: 1, y: 0, duration: 0.5, ease: 'power2.out', delay: i * 0.08,
          scrollTrigger: { trigger: card, start: 'top 90%', once: true }
        });
      });
    }

    function goDetail(id) {
      window.location.href = `farm-detail.html?id=${id}`;
    }

    /* ══════════════════════════════
       筛选
    ══════════════════════════════ */
    document.getElementById('prodFilters').addEventListener('click', e => {
      if (!e.target.classList.contains('prod-filter')) return;
      document.querySelectorAll('.prod-filter').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentType = e.target.dataset.type;
      renderProducts(getFiltered(currentType));
    });

    /* ══════════════════════════════
       Toast
    ══════════════════════════════ */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    /* ══════════════════════════════
       初始化
    ══════════════════════════════ */
    // 使用公共数据初始化
    window.FarmAdoptData && renderProducts(getFiltered('all'));

    // 页面标题入场动效
    gsap.to('.prod-title', {
      opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'power2.out',
      scrollTrigger: { trigger: '.prod-header', start: 'top 85%', once: true }
    });

    window.addEventListener('load', () => {
      setTimeout(() => ScrollTrigger.refresh(), 200);
    });
  </script>
</body>
</html>
